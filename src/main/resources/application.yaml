## yaml-language-server: $schema=https://json.schemastore.org/spring-boot-properties.json
spring:
  security:
  datasource:
    url: jdbc:snowflake://ROEVMLM-VY16593.snowflakecomputing.com/?authenticator=snowflake_jwt
    username: ${SNOWFLAKE_USERNAME}
    driver-class-name: net.snowflake.client.api.driver.SnowflakeDriver
    hikari:
      data-source-properties:
        private_key_file: ${SNOWFLAKE_PRIVATE_KEY_FILE}
        private_key_pwd: ${SNOWFLAKE_PRIVATE_KEY_PASSWORD}
  
server:
  port: 8081